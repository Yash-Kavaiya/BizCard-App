name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.2.0). Required when not running from a tag."
        required: true
        type: string
      play_track:
        description: "Google Play track to upload to"
        required: true
        default: none
        type: choice
        options: [none, internal, alpha, beta, production]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Signed release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: write
    env:
      HAS_PLAY_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      PLAY_TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.play_track || vars.PLAY_TRACK || 'none' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          VERSION_CODE_OFFSET: ${{ vars.VERSION_CODE_OFFSET || '0' }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$INPUT_VERSION"
          fi
          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version name '$name' is not semantic (expected X.Y.Z or X.Y.Z-suffix)"
            exit 1
          fi
          code=$(( VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$name versionCode=$code"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured"
            exit 1
          fi
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Write app secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "::warning::GEMINI_API_KEY secret is not set; this build will use on-device regex parsing only"
            exit 0
          fi
          umask 077
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build signed AAB & APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew :app:bundleRelease :app:assembleRelease
          -PversionCode=${{ steps.version.outputs.code }}
          -PversionName=${{ steps.version.outputs.name }}

      - name: Verify APK signature
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Collect outputs
        id: dist
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/bizcard-ai-$VERSION_NAME.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/bizcard-ai-$VERSION_NAME.apk"
          (cd dist && sha256sum *.aab *.apk > SHA256SUMS.txt)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.name }}
          path: |
            dist/
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: BizCard AI ${{ steps.version.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.aab
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Upload to Google Play
        if: env.HAS_PLAY_CREDENTIALS == 'true' && env.PLAY_TRACK != 'none'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aistudio.bizcardai.leadtap
          releaseFiles: dist/bizcard-ai-${{ steps.version.outputs.name }}.aab
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          track: ${{ env.PLAY_TRACK }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" .env
