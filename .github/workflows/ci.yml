name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Robolectric needs Java 21 to run tests against Android SDK 35+.
  JAVA_VERSION: "21"

jobs:
  build:
    name: Lint, unit tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Unit tests & coverage
        run: ./gradlew :app:testDebugUnitTest :app:createDebugUnitTestCoverageReport

      # Release is built unsigned here: it still exercises R8 shrinking, resource shrinking and
      # lintVitalRelease, which is where most release-only breakages show up.
      - name: Assemble debug & release
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Check Room schema is committed
        run: |
          if [[ -n "$(git status --porcelain -- app/schemas)" ]]; then
            echo "::warning::Room schema changed or is missing from git. Commit app/schemas/ (available in the 'room-schemas' artifact) and add a Migration for any version bump."
            echo "SCHEMA_DIRTY=true" >> "$GITHUB_ENV"
          fi

      - name: Upload Room schema
        if: env.SCHEMA_DIRTY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: app/schemas/
          retention-days: 14

      - name: Upload lint SARIF to code scanning
        if: always() && hashFiles('app/build/reports/lint-results-debug.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
